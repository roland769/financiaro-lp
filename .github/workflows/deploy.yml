# Triggers a Vercel production deployment on every push to main through a Deploy Hook.
# Why: on the Vercel Hobby plan, Git-triggered deployments are blocked when the commit author
# is not a project member. Deploy Hooks build the latest commit of the branch regardless of author.
# Setup (once): Vercel → Project → Settings → Git → Deploy Hooks → create "github-actions" on branch main,
# then GitHub → repo Settings → Secrets and variables → Actions → new secret VERCEL_DEPLOY_HOOK = that URL.
name: Deploy to Vercel
on:
  push:
    branches: [main]
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK secret is not set"; exit 1; fi
          curl -sS -X POST "$HOOK" | head -c 400; echo
